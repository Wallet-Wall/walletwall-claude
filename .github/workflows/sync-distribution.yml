name: Sync Claude distribution

on:
  push:
    branches:
      - main
      - release/canonical-source-pin
    paths:
      - .github/source-pin.json
      - .github/workflows/sync-distribution.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-claude-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: distribution
          fetch-depth: 0
          # The pinned source's install and build run in this job, so no checkout may leave a token in .git/config.
          persist-credentials: false

      - name: Read pinned source
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          repo=$(node -p "require('./distribution/.github/source-pin.json').sourceRepository")
          sha=$(node -p "require('./distribution/.github/source-pin.json').sourceCommit")
          [[ "$repo" == "Wallet-Wall/walletwall-copilot" ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Same rule as CI's origin job: GitHub also serves, by SHA, commits that are on no canonical branch (pull-request
      # refs, fork pull requests included), and this job later holds a contents: write token, so only a pinned commit
      # reachable from the source repository's main may be installed and built here.
      - name: Checkout canonical source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Wallet-Wall/walletwall-copilot
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Require the pinned commit on source main
        working-directory: source
        shell: bash
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "$PIN_SHA" 2>/dev/null || true)" != commit ]; then
            echo "::error::Pinned commit $PIN_SHA is not a commit in Wallet-Wall/walletwall-copilot branch or tag history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PIN_SHA" refs/remotes/origin/main; then
            echo "::error::Pinned commit $PIN_SHA is not reachable from Wallet-Wall/walletwall-copilot main."
            exit 1
          fi
          git checkout --quiet --detach "$PIN_SHA"
          [ "$(git rev-parse HEAD)" = "$PIN_SHA" ]

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install source dependencies
        working-directory: source
        run: npm ci --ignore-scripts

      - name: Build deterministic Claude Directory package
        working-directory: source
        env:
          WALLETWALL_SOURCE_SHA: ${{ steps.pin.outputs.sha }}
        run: npm run build:claude-directory

      - name: Replace distribution payload atomically
        shell: bash
        run: |
          set -euo pipefail
          # The generator owns plugin/ and nothing else; .github/ (this workflow, CI, the pin) is never touched. Both
          # paths are local to this runner.
          mkdir -p distribution/plugin
          rsync -a --delete source/dist/claude-directory/ distribution/plugin/

      - name: Verify generated provenance pin
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.pin.outputs.sha }}'
          actual=$(node -p "require('./distribution/plugin/PROVENANCE.json').sourceCommit")
          repo=$(node -p "require('./distribution/plugin/PROVENANCE.json').sourceRepository")
          [[ "$actual" == "$expected" ]]
          [[ "$repo" == "Wallet-Wall/walletwall-copilot" ]]

      - name: Commit generated distribution
        working-directory: distribution
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A -- plugin
          if git diff --cached --quiet; then
            echo 'Generated distribution already matches the pinned source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: sync Claude distribution from ${{ steps.pin.outputs.sha }}"
          # Only this step sees the write token: an explicit remote plus a one-shot credential helper that reads it
          # from this step's environment, so it is never written to .git/config.
          git remote add publish "https://github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            git -c credential.helper= \
              -c 'credential.helper=!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=${PUBLISH_TOKEN}"; fi; }; f' \
              "$@"
          }
          publish pull --rebase publish "$GITHUB_REF_NAME"
          publish push publish "HEAD:refs/heads/${GITHUB_REF_NAME}"
