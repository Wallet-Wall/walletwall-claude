name: Verify Claude distribution

on:
  pull_request:
  push:
    branches:
      - main
      - feat/submission-grade-bootstrap

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify structure, provenance, and policy boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const root = process.cwd();
          const required = [
            '.claude-plugin/plugin.json',
            '.mcp.json',
            'LICENSE',
            'README.md',
            'PROVENANCE.json',
            'server/walletwall-mcp.mjs',
            'skills/vault-readiness/SKILL.md',
            'skills/walletwall-authority/SKILL.md',
            'skills/walletwall-evidence/SKILL.md',
            'skills/walletwall-evidence-audit/SKILL.md',
          ];
          for (const rel of required) {
            if (!fs.existsSync(path.join(root, rel))) throw new Error(`missing required file: ${rel}`);
          }

          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          if (plugin.name !== 'walletwall') throw new Error(`unexpected plugin name: ${plugin.name}`);
          if (!/^\d+\.\d+\.\d+$/.test(plugin.version ?? '')) throw new Error('plugin version must be explicit semver');
          if (typeof plugin.description !== 'string' || plugin.description.length === 0) throw new Error('plugin description required');

          const mcp = JSON.parse(fs.readFileSync('.mcp.json', 'utf8'));
          if (JSON.stringify(Object.keys(mcp)) !== JSON.stringify(['walletwall'])) throw new Error('exactly one MCP server named walletwall is required');
          const server = mcp.walletwall;
          if (server.command !== 'node') throw new Error('WalletWall MCP must launch with node');
          if (JSON.stringify(server.args) !== JSON.stringify(['${CLAUDE_PLUGIN_ROOT}/server/walletwall-mcp.mjs'])) throw new Error('WalletWall MCP entry path changed');
          if ('env' in server) throw new Error('Claude MCP config must not inject environment variables or credentials');
          const serializedMcp = JSON.stringify(mcp);
          if (/https?:\/\//i.test(serializedMcp)) throw new Error('Claude MCP config must not point to a remote server');

          const pin = JSON.parse(fs.readFileSync('.github/source-pin.json', 'utf8'));
          const provenance = JSON.parse(fs.readFileSync('PROVENANCE.json', 'utf8'));
          if (provenance.schemaVersion !== '1') throw new Error('unsupported provenance schema');
          if (provenance.sourceRepository !== pin.sourceRepository) throw new Error('provenance repository does not match source pin');
          if (provenance.sourceCommit !== pin.sourceCommit) throw new Error('provenance commit does not match source pin');
          if (!Array.isArray(provenance.files) || provenance.files.length === 0) throw new Error('provenance file manifest missing');
          if (provenance.files.length > 512) throw new Error(`distribution has ${provenance.files.length} manifested files; max 512`);

          const media = /\.(?:png|jpe?g|gif|webp|svg|woff2?|ttf|otf)$/i;
          const seen = new Set();
          for (const entry of provenance.files) {
            if (seen.has(entry.path)) throw new Error(`duplicate provenance path: ${entry.path}`);
            seen.add(entry.path);
            const absolute = path.join(root, ...entry.path.split('/'));
            if (!fs.existsSync(absolute) || !fs.statSync(absolute).isFile()) throw new Error(`manifested file missing: ${entry.path}`);
            const bytes = fs.readFileSync(absolute);
            if (bytes.length !== entry.bytes) throw new Error(`size mismatch: ${entry.path}`);
            const digest = crypto.createHash('sha512').update(bytes).digest('hex');
            if (digest !== entry.sha512) throw new Error(`SHA-512 mismatch: ${entry.path}`);
            if (!media.test(entry.path) && bytes.length > 256 * 1024) throw new Error(`non-media file exceeds 256 KiB: ${entry.path}`);
          }

          const ajv = fs.readFileSync('node_modules/@modelcontextprotocol/sdk/dist/esm/validation/ajv-provider.js', 'utf8');
          if (!ajv.includes('SDK JSON Schema validation is disabled in the WalletWall Claude Directory package.')) {
            throw new Error('fail-closed AJV boundary missing');
          }

          console.log(`Verified ${provenance.files.length} provenance entries from ${provenance.sourceCommit}.`);
          NODE

      - name: Verify payload shape and manifest closure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          // A merge publishes the tracked tree, so read it from git rather than from the filesystem.
          const tracked = execFileSync('git', ['ls-files', '-z', '--format=%(objectmode) %(path)'], { encoding: 'utf8' })
            .split(String.fromCharCode(0))
            .filter(Boolean)
            .map(record => {
              const space = record.indexOf(' ');
              return { mode: record.slice(0, space), path: record.slice(space + 1) };
            });
          const payload = tracked.filter(({ path }) => !path.startsWith('.github/'));
          const under = prefix => payload.map(({ path }) => path).filter(path => path.startsWith(prefix)).sort();

          const allowedRootEntries = ['.claude-plugin/', '.github/', '.mcp.json', 'LICENSE', 'PROVENANCE.json', 'README.md', 'node_modules/', 'server/', 'skills/'];
          const rootEntries = new Set(tracked.map(({ path }) => (path.includes('/') ? `${path.split('/')[0]}/` : path)));
          const unexpectedRootEntries = [...rootEntries].filter(entry => !allowedRootEntries.includes(entry)).sort();
          const missingRootEntries = allowedRootEntries.filter(entry => !rootEntries.has(entry));
          if (unexpectedRootEntries.length > 0) throw new Error(`unexpected root entries: ${unexpectedRootEntries.join(', ')}`);
          if (missingRootEntries.length > 0) throw new Error(`missing root entries: ${missingRootEntries.join(', ')}`);

          const irregular = payload.filter(({ mode }) => mode !== '100644');
          if (irregular.length > 0) {
            throw new Error(`payload entries must be regular non-executable files: ${irregular.map(({ mode, path }) => `${mode} ${path}`).join(', ')}`);
          }

          if (JSON.stringify(under('.claude-plugin/')) !== JSON.stringify(['.claude-plugin/plugin.json'])) {
            throw new Error(`.claude-plugin must hold only plugin.json: ${under('.claude-plugin/').join(', ')}`);
          }
          // Metadata only. Component keys (commands, agents, skills, hooks, mcpServers, lspServers, outputStyles)
          // can inline or redirect executable surface, so none of them is allowed here.
          const allowedPluginKeys = ['name', 'displayName', 'version', 'description', 'author', 'homepage', 'repository', 'license', 'keywords'];
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          const forbiddenPluginKeys = Object.keys(plugin).filter(key => !allowedPluginKeys.includes(key));
          if (forbiddenPluginKeys.length > 0) throw new Error(`plugin.json keys outside the metadata allowlist: ${forbiddenPluginKeys.join(', ')}`);

          const expectedSkillFiles = ['vault-readiness', 'walletwall-authority', 'walletwall-evidence', 'walletwall-evidence-audit']
            .map(skill => `skills/${skill}/SKILL.md`)
            .sort();
          if (JSON.stringify(under('skills/')) !== JSON.stringify(expectedSkillFiles)) {
            throw new Error(`skills must be exactly ${expectedSkillFiles.join(', ')}; found ${under('skills/').join(', ')}`);
          }

          const provenance = JSON.parse(fs.readFileSync('PROVENANCE.json', 'utf8'));
          const manifested = new Set(provenance.files.map(({ path }) => path));
          const payloadFiles = payload.map(({ path }) => path).filter(path => path !== 'PROVENANCE.json');
          const unmanifested = payloadFiles.filter(path => !manifested.has(path));
          if (unmanifested.length > 0) throw new Error(`tracked payload files missing from PROVENANCE.json: ${unmanifested.join(', ')}`);
          const payloadSet = new Set(payloadFiles);
          const untracked = [...manifested].filter(path => !payloadSet.has(path));
          if (untracked.length > 0) throw new Error(`PROVENANCE.json lists untracked files: ${untracked.join(', ')}`);

          console.log(`Verified payload shape: ${payloadFiles.length} tracked payload files, every one manifested.`);
          NODE

      - name: Smoke exact WalletWall MCP tool surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';

          const expected = [
            'assess_vault_readiness',
            'check_invariants',
            'inspect_evidence',
            'normalize_observation',
            'resolve_asset',
            'trace_provenance',
          ];

          const child = spawn(process.execPath, ['./server/walletwall-mcp.mjs'], {
            stdio: ['pipe', 'pipe', 'pipe'],
          });
          let stdout = '';
          let stderr = '';
          const pending = new Map();
          const timeout = setTimeout(() => {
            child.kill();
            throw new Error(`MCP smoke timed out. stderr: ${stderr.trim()}`);
          }, 5000);

          function send(message) {
            child.stdin.write(`${JSON.stringify(message)}\n`);
          }

          function request(id, method, params = {}) {
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              send({ jsonrpc: '2.0', id, method, params });
            });
          }

          child.stderr.on('data', chunk => {
            if (stderr.length < 8192) stderr += chunk.toString('utf8');
          });
          child.stdout.on('data', chunk => {
            stdout += chunk.toString('utf8');
            while (stdout.includes('\n')) {
              const index = stdout.indexOf('\n');
              const line = stdout.slice(0, index).replace(/\r$/, '');
              stdout = stdout.slice(index + 1);
              if (!line) continue;
              let message;
              try {
                message = JSON.parse(line);
              } catch (error) {
                clearTimeout(timeout);
                child.kill();
                throw new Error(`invalid JSON-RPC from MCP server: ${line}`, { cause: error });
              }
              if (message.id !== undefined && pending.has(message.id)) {
                const waiter = pending.get(message.id);
                pending.delete(message.id);
                if (message.error) waiter.reject(new Error(JSON.stringify(message.error)));
                else waiter.resolve(message.result);
              }
            }
          });
          child.on('exit', code => {
            if (code !== null && code !== 0 && pending.size > 0) {
              for (const waiter of pending.values()) waiter.reject(new Error(`MCP server exited ${code}: ${stderr.trim()}`));
              pending.clear();
            }
          });

          try {
            const initialized = await request(1, 'initialize', {
              protocolVersion: '2025-11-25',
              capabilities: {},
              clientInfo: { name: 'walletwall-claude-ci', version: '0' },
            });
            if (initialized?.serverInfo?.name !== 'walletwall-mcp') {
              throw new Error(`unexpected MCP server name: ${initialized?.serverInfo?.name ?? 'missing'}`);
            }
            send({ jsonrpc: '2.0', method: 'notifications/initialized' });
            const listed = await request(2, 'tools/list');
            const names = (listed?.tools ?? []).map(tool => tool.name).sort();
            if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error(`tool surface changed: ${names.join(', ')}`);
            console.log(`MCP smoke passed with ${names.length} tools.`);
          } finally {
            clearTimeout(timeout);
            child.stdin.end();
            child.kill();
          }
          NODE

      - name: Reject obvious execution capability drift
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude-dir=.github \
            'eth_sendRawTransaction|eth_sendTransaction|personal_sign|eth_signTransaction|wallet_sendCalls|sendTransaction\(|broadcastTransaction\(|transferFrom\(' \
            server skills .mcp.json; then
            echo 'Potential signing, broadcast, or transfer capability detected.' >&2
            exit 1
          fi

  # The verify job proves the payload agrees with PROVENANCE.json and the pin, but a pull request can rewrite all
  # three together. This job proves origin instead: it regenerates the package from the pinned canonical source
  # commit and requires the committed payload to be exactly that output.
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout distribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: distribution
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate source pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pin = JSON.parse(fs.readFileSync('distribution/.github/source-pin.json', 'utf8'));
          const keys = Object.keys(pin).sort().join(', ');
          if (keys !== 'sourceCommit, sourceRepository') throw new Error(`source pin must hold exactly sourceRepository and sourceCommit; found ${keys}`);
          if (pin.sourceRepository !== 'Wallet-Wall/walletwall-copilot') {
            throw new Error(`source pin must name Wallet-Wall/walletwall-copilot; found ${JSON.stringify(pin.sourceRepository)}`);
          }
          if (typeof pin.sourceCommit !== 'string' || !/^[0-9a-f]{40}$/.test(pin.sourceCommit)) {
            throw new Error(`source pin commit must be a full 40-character lowercase hex SHA; found ${JSON.stringify(pin.sourceCommit)}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${pin.sourceCommit}\n`);
          console.log(`Source pin: ${pin.sourceRepository}@${pin.sourceCommit}`);
          NODE

      # Fetch the canonical branch and tag history instead of the pinned SHA: GitHub also serves, by SHA, commits that
      # are on no canonical branch (pull-request refs, fork pull requests included), so only ancestry of main proves origin.
      - name: Checkout canonical source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Wallet-Wall/walletwall-copilot
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Require the pinned commit on source main
        working-directory: source
        shell: bash
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "$PIN_SHA" 2>/dev/null || true)" != commit ]; then
            echo "::error::Pinned commit $PIN_SHA is not a commit in Wallet-Wall/walletwall-copilot branch or tag history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PIN_SHA" refs/remotes/origin/main; then
            echo "::error::Pinned commit $PIN_SHA is not reachable from Wallet-Wall/walletwall-copilot main ($(git rev-parse refs/remotes/origin/main))."
            exit 1
          fi
          git checkout --quiet --detach "$PIN_SHA"
          [ "$(git rev-parse HEAD)" = "$PIN_SHA" ]
          echo "Pinned commit $PIN_SHA is reachable from source main $(git rev-parse refs/remotes/origin/main)."

      - name: Install pinned source dependencies
        working-directory: source
        run: npm ci --ignore-scripts

      - name: Regenerate the distribution from the pinned source
        working-directory: source
        env:
          WALLETWALL_SOURCE_SHA: ${{ steps.pin.outputs.sha }}
        run: npm run build:claude-directory

      - name: Require the committed payload to equal the regeneration
        shell: bash
        run: |
          set -euo pipefail
          # Ask rsync what a sync would change. The anchored excludes skip only the top-level .git/ and .github/, and
          # --checksum without --times compares content, links, and modes rather than checkout timestamps.
          options=(--recursive --links --perms --checksum --delete --dry-run --itemize-changes --exclude=/.git/ --exclude=/.github/)
          changes=$(rsync "${options[@]}" source/dist/claude-directory/ distribution/)
          if [ -n "$changes" ]; then
            echo "::error::The committed payload is not the regeneration of the pinned source. A sync would change:"
            printf '%s\n' "$changes"
            echo 'Legend: *deleting = not produced by the generator, >f+++ = generated file missing, >fc = content differs, .f...p = mode differs.'
            exit 1
          fi
          echo "Committed payload equals the regeneration of the pinned source ($(find source/dist/claude-directory -type f | wc -l) files)."
